services:
  db:
    image: postgres:16-alpine
    container_name: product_stats_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: product_stats_redis
    ports:
      - "6379:6379"

  migrate:
    build: .
    container_name: product_stats_migrate
    command: >
      sh -c "python manage.py migrate &&
             python manage.py import_products"
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build: .
    container_name: product_stats_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully

  celery_worker:
    build: .
    container_name: product_stats_celery_worker
    command: celery -A settings.celery worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

  celery_beat:
    build: .
    container_name: product_stats_celery_beat
    command: celery -A settings.celery beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      celery_worker:
        condition: service_started

volumes:
  postgres_data: